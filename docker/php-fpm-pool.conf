; LigtasAlertWEB PHP-FPM pool (audit §1.1).
; Listens on a unix socket so nginx proxies PHP without a TCP hop.
; Runs as www-data, matching the container user and the nginx user.

[www]
listen = /var/run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

user = www-data
group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 5

; Security: never expose PHP source as plain text.
security.limit_extensions = .php

env[APP_ENV] = production
env[APP_DEBUG] = false