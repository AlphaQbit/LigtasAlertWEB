# LigtasAlertWEB nginx configuration (audit §1.1, §3.4).
#
# nginx is the ONLY trusted reverse proxy. It authoritatively passes the
# forwarded headers that bootstrap/app.php trusts from 127.0.0.1:
#   X-Forwarded-Proto   — passed through from Render's load balancer.
#                           Render terminates TLS and forwards HTTP with
#                           X-Forwarded-Proto: https (or http for redirects).
#   X-Forwarded-For     — appends the real client IP. Laravel reads the
#                           left-most entry, so spoofed client headers
#                           cannot override it.
#   X-Forwarded-Host    — passes the real Host header.
#
# $PORT is substituted by entrypoint.sh at container start from Render's
# assigned port. No hard-coded port exists here.

user www-data;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Serve the Vite manifest and hashed assets directly, bypassing PHP.
    # The manifest is produced by `npm run build` in the Dockerfile (audit R3).
    map $request_uri $static_skip {
        default 0;
        "~^/build/" 1;
    }

    # Map X-Forwarded-Proto to canonical HTTPS values for FastCGI.
    # Render terminates TLS at its edge load balancer and forwards HTTP.
    # The original request scheme is in the X-Forwarded-Proto header.
    # We pass this through to PHP-FPM; do NOT hardcode HTTPS.
    # This map ensures HTTPS is always "on" or "off" — never a raw header value.
    map $http_x_forwarded_proto $https_canonical {
        default off;
        https    on;
        http     off;
    }

    server {
        listen ${PORT} default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        # Render terminates TLS at its edge load balancer and forwards HTTP.
        # The original request scheme is in the X-Forwarded-Proto header.
        # We pass this through to PHP-FPM; do NOT hardcode HTTPS.

        # Authoritative forwarded headers. These are set by nginx itself
        # based on headers from Render's load balancer, never copied from
        # client input, so they cannot be spoofed.
        # proxy_set_header is NOT used here because we use FastCGI, not proxy_pass.

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Static assets: bypass PHP entirely.
        location /build/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location ~ \.php$ {
            fastcgi_pass unix:/var/run/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            # fastcgi_params must be included BEFORE custom fastcgi_param overrides
            # because the default fastcgi_params contains "fastcgi_param HTTPS \$https if_not_empty;"
            # which would override our explicit value if included after.
            include fastcgi_params;

            # Explicitly set REMOTE_ADDR to 127.0.0.1 so Laravel's trusted proxy
            # check (bootstrap/app.php:24, at: '127.0.0.1') matches.
            # The Unix socket peer address is a filesystem path, not an IP,
            # so the default fastcgi_params REMOTE_ADDR would be empty.
            # Nginx is the only path to PHP-FPM (Unix socket, no external exposure).
            fastcgi_param REMOTE_ADDR 127.0.0.1;

            # Pass the original request scheme from Render's load balancer.
            # Render terminates TLS and adds X-Forwarded-Proto: https (or http).
            # We trust this header because nginx is the ONLY trusted proxy
            # (bootstrap/app.php trusts 127.0.0.1 only).
            # Use the canonical on/off mapping for HTTPS so fallback behavior
            # is correct even if proxy trust fails.
            fastcgi_param HTTPS $https_canonical;
            fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;

            # Client IP: Render LB adds X-Forwarded-For; nginx appends its own peer.
            # The trusted proxy (127.0.0.1) reads the left-most entry.
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

            # Host header from the original request.
            fastcgi_param HTTP_X_FORWARDED_HOST $host;

            fastcgi_read_timeout 300;
        }

        location = /up {
            try_files $uri =404;
        }
    }
}